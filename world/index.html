<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RENIV WORLD — 픽셀 오피스</title>
<style>
  :root{
    --brown:#5A4634; --tan:#8A715A; --cream:#FFF8EC; --line:#E8D9C2;
    --mint:#2FA98C; --blue:#5B8DEF; --pink:#E8768F; --gold:#E0A458; --purple:#9B7EDE;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#BFE0F5;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--brown)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #app{position:fixed;inset:0}

  .bar{position:fixed;top:0;left:0;right:0;height:54px;z-index:10;
    display:flex;align-items:center;gap:12px;padding:0 14px;
    background:rgba(255,248,236,.92);border-bottom:3px solid var(--line);backdrop-filter:blur(6px)}
  .brand{font-weight:900;font-size:16px;letter-spacing:-.3px}
  .brand span{color:var(--mint)}
  .stamp{font-size:11.5px;color:var(--tan)}
  .grow{flex:1}
  .btn{background:#fff;border:2px solid var(--line);color:var(--brown);
    font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:12px;cursor:pointer;
    box-shadow:0 2px 0 var(--line)}
  .btn:hover{background:#FFF3DD}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
  .btn.on{background:var(--mint);border-color:#1F8A70;color:#fff;box-shadow:0 2px 0 #1F8A70}
  .btn.meet{background:var(--pink);border-color:#C4506C;color:#fff;box-shadow:0 2px 0 #C4506C}

  .rooms{position:fixed;left:12px;top:66px;z-index:10;display:flex;flex-direction:column;gap:6px}
  .rooms .btn{text-align:left;min-width:128px}

  .panel{position:fixed;right:12px;top:66px;width:300px;max-height:calc(100vh - 150px);z-index:10;
    background:rgba(255,252,245,.96);border:3px solid var(--line);border-radius:16px;
    padding:16px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(90,70,52,.18)}
  .panel.show{display:block}
  .panel h3{margin:0 0 4px;font-size:16px}
  .panel .sub{font-size:11.5px;color:var(--tan);margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;
    border-bottom:2px dashed var(--line);font-size:13px}
  .kv b{font-variant-numeric:tabular-nums;font-weight:800}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 10px;
    border-radius:99px;background:#FFEAC9;color:#9C6A1E;margin-bottom:10px}
  .warn{color:#D6455D}

  .kpi{position:fixed;left:12px;bottom:12px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;max-width:64vw}
  .card{background:rgba(255,252,245,.95);border:2px solid var(--line);border-radius:14px;
    padding:8px 13px;min-width:106px;box-shadow:0 3px 0 var(--line)}
  .card .l{font-size:10.5px;color:var(--tan);font-weight:700}
  .card .v{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.4px}

  .alerts{position:fixed;right:12px;bottom:12px;z-index:10;max-width:300px}
  .alert{background:#FFE3E8;border:2px solid #F3AAB9;color:#B03A52;border-radius:12px;
    padding:8px 12px;font-size:12px;font-weight:700;margin-top:6px}

  .gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#BFE0F5 0%,#DFF0FA 55%,#C9E8C5 100%)}
  .gate .box{text-align:center;max-width:400px;padding:34px;background:rgba(255,252,245,.94);
    border:3px solid var(--line);border-radius:22px;box-shadow:0 10px 0 var(--line)}
  .gate h1{font-size:28px;margin:0 0 8px;letter-spacing:-.5px}
  .gate h1 span{color:var(--mint)}
  .gate p{color:var(--tan);font-size:13px;line-height:1.6;margin:0 0 20px}
  .gate .btn{font-size:14px;padding:12px 22px}
  .err{color:#D6455D;font-size:12px;margin-top:12px;min-height:16px}
  @media (max-width:820px){
    .panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:44vh}
    .kpi{max-width:calc(100vw - 24px);bottom:auto;top:62px}
    .alerts{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="bar">
  <div class="brand">🏢 RENIV <span>WORLD</span></div>
  <div class="stamp" id="stamp">불러오는 중…</div>
  <div class="grow"></div>
  <button class="btn meet" id="btn-meet">📣 회의 소집</button>
  <button class="btn" id="btn-reload">🔄 새로고침</button>
</div>

<div class="rooms" id="rooms"></div>
<div class="panel" id="panel"></div>
<div class="kpi" id="kpi"></div>
<div class="alerts" id="alerts"></div>

<div class="gate" id="gate">
  <div class="box">
    <h1>🏢 RENIV <span>WORLD</span></h1>
    <p>르니브 ERP를 귀여운 픽셀 오피스로 봅니다.<br>회사 계정으로 로그인해 주세요.</p>
    <button class="btn" id="btn-login">구글 계정으로 로그인</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const FB = window.__FB__ || null;
const DEMO = new URLSearchParams(location.search).has('demo');
const PIX = 0.38;                      // 픽셀 아트 해상도 (낮을수록 도트 굵음)

/* ═══════ 파스텔 팔레트 ═══════ */
const P = {
  floor:0xF4E7CF, grass:0xA9D9A0, wallLine:0xE3D2B4,
  mint:0x2FA98C, blue:0x5B8DEF, pink:0xE8768F, gold:0xE0A458, purple:0x9B7EDE,
  wood:0xC89B6C, woodDark:0x9C7248, white:0xFFFDF6, gray:0x8FA0AD,
  screen:0x2C3E50, paper:0xFFF9E8, skin:0xF6D7B8,
};

const ZONES = [
  { id:'ceo',       name:'대표이사실', x:-32, z:-16, w:26, d:20, color:0xBFE8DC, cam:[-32,17,6],  tgt:[-32,1,-16] },
  { id:'design',    name:'디자인팀',   x: 32, z:-16, w:26, d:20, color:0xF6D3DB, cam:[ 32,17,6],  tgt:[ 32,1,-16] },
  { id:'sales',     name:'국내영업팀', x:-32, z: 16, w:26, d:20, color:0xCCDCF8, cam:[-32,17,38], tgt:[-32,1,16] },
  { id:'marketing', name:'마케팅팀',   x: 32, z: 16, w:26, d:20, color:0xE2D7F6, cam:[ 32,17,38], tgt:[ 32,1,16] },
  { id:'meeting',   name:'회의실',     x:  0, z: -8, w:24, d:18, color:0xFBE7C0, cam:[0,18,14],   tgt:[0,1,-8] },
  { id:'warehouse', name:'창고',       x:  0, z: 25, w:36, d:14, color:0xEFE0BC, cam:[0,18,46],   tgt:[0,1,25] },
];

/* ═══════ 씬 ═══════ */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xBFE0F5);
scene.fog = new THREE.Fog(0xBFE0F5, 110, 220);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 54, 66);

const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
app.appendChild(renderer.domElement);
function resize(){
  renderer.setPixelRatio(1);
  renderer.setSize(Math.round(innerWidth*PIX), Math.round(innerHeight*PIX), false);
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI/2 - 0.1;
controls.minDistance = 10;
controls.maxDistance = 140;

scene.add(new THREE.AmbientLight(0xFFF6E8, 0.85));
scene.add(new THREE.HemisphereLight(0xCFE8FF, 0xE8D9C4, 0.5));
const sun = new THREE.DirectionalLight(0xFFF2D8, 1.0);
sun.position.set(36, 60, 28);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
const SS = 80;
Object.assign(sun.shadow.camera, { left:-SS, right:SS, top:SS, bottom:-SS, near:1, far:200 });
scene.add(sun);

/* 잔디 + 오피스 바닥 */
const grass = new THREE.Mesh(new THREE.PlaneGeometry(400,400),
  new THREE.MeshLambertMaterial({ color:P.grass }));
grass.rotation.x = -Math.PI/2; grass.position.y = -0.3; grass.receiveShadow = true;
scene.add(grass);

const floor = new THREE.Mesh(new THREE.BoxGeometry(104, 0.6, 70),
  new THREE.MeshLambertMaterial({ color:P.floor }));
floor.position.y = -0.3; floor.receiveShadow = true;
scene.add(floor);

/* 존 러그 */
ZONES.forEach(z=>{
  const rug = new THREE.Mesh(new THREE.BoxGeometry(z.w, 0.14, z.d),
    new THREE.MeshLambertMaterial({ color:z.color }));
  rug.position.set(z.x, 0.07, z.z); rug.receiveShadow = true;
  scene.add(rug);
});

const dataGroup = new THREE.Group(); scene.add(dataGroup);
const pickable = [];
function addPick(m, info){ m.userData.info = info; pickable.push(m); }

/* ═══════ 헬퍼 ═══════ */
function won(n){ return (Math.round(Number(n)||0)).toLocaleString('ko-KR')+'원'; }
function shortWon(n){
  n = Math.round(Number(n)||0);
  if (Math.abs(n) >= 100000000) return (n/100000000).toFixed(1)+'억';
  if (Math.abs(n) >= 10000) return Math.round(n/10000).toLocaleString('ko-KR')+'만';
  return n.toLocaleString('ko-KR');
}
function box(w,h,d,color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({ color }));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function label(text, o={}){
  const size = o.size||44, pad = 16;
  const c = document.createElement('canvas');
  const g0 = c.getContext('2d');
  g0.font = `800 ${size}px Pretendard,'Malgun Gothic',sans-serif`;
  c.width = Math.ceil(g0.measureText(text).width)+pad*2; c.height = size+pad*2;
  const g = c.getContext('2d');
  g.font = `800 ${size}px Pretendard,'Malgun Gothic',sans-serif`;
  if (o.bg !== null){
    g.fillStyle = o.bg||'rgba(255,252,245,.92)';
    g.beginPath(); g.roundRect(0,0,c.width,c.height,16); g.fill();
    g.lineWidth = 4; g.strokeStyle = o.border||'#E3D2B4';
    g.beginPath(); g.roundRect(2,2,c.width-4,c.height-4,14); g.stroke();
  }
  g.fillStyle = o.color||'#5A4634';
  g.textBaseline = 'middle'; g.fillText(text, pad, c.height/2);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
  const s = o.scale||0.024;
  sp.scale.set(c.width*s, c.height*s, 1);
  return sp;
}

/* ═══════ 픽셀 얼굴 ═══════ */
function faceTexture(mood){
  const c = document.createElement('canvas'); c.width = 32; c.height = 32;
  const g = c.getContext('2d');
  g.fillStyle = '#F6D7B8'; g.fillRect(0,0,32,32);
  g.fillStyle = '#3A2C20';
  g.fillRect(8,13,4,5); g.fillRect(20,13,4,5);            // 눈
  g.fillStyle = '#FFFFFF';
  g.fillRect(9,14,1,1); g.fillRect(21,14,1,1);            // 눈 반짝
  g.fillStyle = '#F0A093';
  g.fillRect(4,20,4,3); g.fillRect(24,20,4,3);            // 볼터치
  g.fillStyle = '#7A4A3A';
  if (mood === 'smile'){ g.fillRect(13,22,6,2); g.fillRect(12,21,1,1); g.fillRect(19,21,1,1); }
  else { g.fillRect(13,22,6,2); }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  return t;
}

/* ═══════ 복셀 캐릭터 ═══════ */
const chars = [];
function makeChar(cfg){
  const g = new THREE.Group();
  const pants = 0x4A5568;

  const legL = box(0.34,0.8,0.36,pants); legL.position.set(-0.22,0.4,0);
  const legR = box(0.34,0.8,0.36,pants); legR.position.set( 0.22,0.4,0);

  const body = box(1.15,1.05,0.72,cfg.shirt); body.position.y = 1.32;

  const armGeo = ()=> {
    const geo = new THREE.BoxGeometry(0.3,0.85,0.34);
    geo.translate(0,-0.36,0);
    return geo;
  };
  const armMat = new THREE.MeshLambertMaterial({ color:cfg.shirt });
  const armL = new THREE.Mesh(armGeo(), armMat); armL.castShadow = true;
  armL.position.set(-0.76,1.78,0);
  const armR = new THREE.Mesh(armGeo(), armMat.clone()); armR.castShadow = true;
  armR.position.set( 0.76,1.78,0);

  const skinMat = new THREE.MeshLambertMaterial({ color:P.skin });
  const faceMat = new THREE.MeshLambertMaterial({ map:faceTexture('smile') });
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.15,1.1,1.05),
    [skinMat,skinMat,skinMat,skinMat,faceMat,skinMat]);
  head.position.y = 2.45; head.castShadow = true;

  const hairTop = box(1.25,0.36,1.15,cfg.hair); hairTop.position.y = 3.1;
  const hairBack = box(1.25,0.7,0.3,cfg.hair); hairBack.position.set(0,2.6,-0.45);

  const tag = label(cfg.name, { size:40, scale:0.02, border:cfg.tagColor });
  tag.position.y = 4.0;

  g.add(legL,legR,body,armL,armR,head,hairTop,hairBack,tag);
  [body,head].forEach(m=>addPick(m, cfg.info));

  g.position.set(cfg.desk.x, 0, cfg.desk.z);
  g.rotation.y = cfg.desk.ry;
  scene.add(g);

  const ch = { g, legL, legR, armL, armR, head,
    deskPos:{...cfg.desk}, seatPos:{...cfg.seat},
    pos:new THREE.Vector2(cfg.desk.x, cfg.desk.z),
    target:null, targetRy:cfg.desk.ry, phase:Math.random()*6.28, bubble:null };
  chars.push(ch);
  return ch;
}

/* ═══════ 가구 ═══════ */
function makeDesk(x, z, ry, screenText, screenColor, info){
  const g = new THREE.Group();
  const top = box(4.4,0.28,2.0,P.wood); top.position.y = 1.5;
  const l1 = box(0.24,1.5,0.24,P.woodDark); l1.position.set(-2.0,0.75,-0.8);
  const l2 = l1.clone(); l2.position.set( 2.0,0.75,-0.8);
  const l3 = l1.clone(); l3.position.set(-2.0,0.75, 0.8);
  const l4 = l1.clone(); l4.position.set( 2.0,0.75, 0.8);
  const kb = box(1.3,0.08,0.5,P.white); kb.position.set(0,1.68,0.45);

  const stand = box(0.16,0.5,0.16,0x555F6A); stand.position.set(0,1.9,-0.55);
  const scr = box(2.0,1.25,0.14,0x3B4C5C); scr.position.set(0,2.7,-0.55);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.05),
    new THREE.MeshBasicMaterial({ color:screenColor }));
  face.position.set(0,2.7,-0.47);
  const st = label(screenText, { size:34, scale:0.014, bg:null, color:'#FFFFFF' });
  st.position.set(0,2.72,-0.40);

  g.add(top,l1,l2,l3,l4,kb,stand,scr,face,st);
  g.position.set(x,0,z); g.rotation.y = ry;
  [top,scr].forEach(m=>addPick(m, info));
  scene.add(g);
  return g;
}
function makeChair(x,z,ry,color){
  const g = new THREE.Group();
  const seat = box(1.1,0.22,1.1,color); seat.position.y = 0.85;
  const back = box(1.1,1.1,0.2,color); back.position.set(0,1.55,-0.45);
  const leg = box(0.18,0.85,0.18,P.woodDark); leg.position.set(0,0.42,0);
  g.add(seat,back,leg);
  g.position.set(x,0,z); g.rotation.y = ry;
  scene.add(g);
}
function makePlant(x,z){
  const g = new THREE.Group();
  const pot = box(0.8,0.7,0.8,0xC97B4A); pot.position.y = 0.35;
  const bush = box(1.1,1.1,1.1,0x59B36A); bush.position.y = 1.35;
  const bush2 = box(0.7,0.6,0.7,0x6FC77E); bush2.position.y = 2.05;
  g.add(pot,bush,bush2);
  g.position.set(x,0,z);
  scene.add(g);
}

/* 회의실 */
const MEET = { x:0, z:-8 };
const mTable = box(9.5,0.4,4.2,P.wood); mTable.position.set(MEET.x,1.5,MEET.z); scene.add(mTable);
[[-3.4,-1.6],[3.4,-1.6],[-3.4,1.6],[3.4,1.6]].forEach(([dx,dz])=>{
  const leg = box(0.3,1.5,0.3,P.woodDark);
  leg.position.set(MEET.x+dx,0.75,MEET.z+dz);
  scene.add(leg);
});
const MEET_SEATS = [
  { x:MEET.x-3.0, z:MEET.z+3.6 }, { x:MEET.x+3.0, z:MEET.z+3.6 },
  { x:MEET.x-3.0, z:MEET.z-3.6 }, { x:MEET.x+3.0, z:MEET.z-3.6 },
];
MEET_SEATS.forEach(s=> makeChair(s.x, s.z, s.z>MEET.z ? Math.PI : 0, 0xF2B8A0));
const board = box(7.5,4,0.3,P.white); board.position.set(MEET.x, 3.4, MEET.z-8.2); scene.add(board);
const boardTxt = label('📋 주간 회의', { size:46, scale:0.02 });
boardTxt.position.set(MEET.x, 5.9, MEET.z-8.0); scene.add(boardTxt);
addPick(mTable, { title:'회의실', tag:'RENIV WORLD',
  rows:[['용도','AI 직원 주간 회의'],['참석','Tim · IAN · Greg · Jony']],
  note:'상단 [회의 소집] 버튼을 누르면 모두 모입니다.' });

/* 존 이름표 + 화분 */
ZONES.forEach(z=>{
  if (z.id === 'meeting' || z.id === 'warehouse') return;
  const t = label(z.name, { size:46, scale:0.023 });
  t.position.set(z.x, 4.6, z.z + z.d/2 - 1.4);
  scene.add(t);
});
const wt = label('📦 창고', { size:46, scale:0.023 }); wt.position.set(0, 5.2, 31); scene.add(wt);
const mt2 = label('회의실', { size:46, scale:0.023 }); mt2.position.set(0, 4.6, 0.6); scene.add(mt2);
makePlant(-46, -30); makePlant(46, -30); makePlant(-46, 30); makePlant(46, 30);
makePlant(-14, -8); makePlant(14, -8);

/* ═══════ 직원 + 책상 ═══════ */
const EMP = [
  { id:'tim',  name:'Tim',  zone:'ceo',       shirt:0x2FA98C, hair:0x4A3628, tagColor:'#2FA98C',
    info:{ title:'Tim · 비서', tag:'AI 직원',
      rows:[['담당','주문 리포트'],['보고','매일 07:30'],['채널','#대표이사']],
      note:'ERP 매출·재고·결재를 조회해 답합니다.' } },
  { id:'ian',  name:'IAN',  zone:'sales',     shirt:0x5B8DEF, hair:0x2E2E38, tagColor:'#5B8DEF',
    info:{ title:'IAN · 국내영업팀장', tag:'AI 직원',
      rows:[['담당','바로팜 주문·재고'],['보고','평일 13:00'],['채널','#국내영업팀']],
      note:'바로팜 주문을 ERP에 자동 입력하고 재고를 차감합니다.' } },

function cuteBar(x, z, h, w, color, info, text){

function barH(v, vmax, max=6, min=0.6){
  v = Math.max(0, Number(v)||0); vmax = Math.max(1, Number(vmax)||1);
  return min + (max-min)*Math.sqrt(Math.min(v/vmax,1));
}

const clock = new THREE.Clock();
let T = 0, emoTimer = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;

  chars.forEach((ch,i)=>{
    if (ch.target){
      const cur = ch.pos, dstV = ch.target;
      const d = dstV.clone().sub(cur);
      const dist = d.length();
      if (dist < 0.08){
        ch.pos.copy(dstV); ch.target = null;
        ch.targetRy = meeting
          ? Math.atan2(MEET.x-ch.pos.x, MEET.z-ch.pos.y)
          : ch.deskPos.ry;
      } else {
        const step = Math.min(dist, dt*6.5);
        d.normalize().multiplyScalar(step);
        cur.add(d);
        ch.targetRy = Math.atan2(d.x, d.y);
        ch.g.position.y = 0;
        const s = Math.sin(T*11 + i);
        ch.legL.rotation.x = s*0.7; ch.legR.rotation.x = -s*0.7;
        ch.armL.rotation.x = -s*0.55; ch.armR.rotation.x = s*0.55;
      }
      ch.g.position.set(ch.pos.x, 0, ch.pos.y);
    } else {
      if (!meeting){ ch.legL.rotation.x *= 0.8; ch.legR.rotation.x *= 0.8; }
      if (meeting){
        ch.g.position.y = 0.46;                       // 의자에 앉기
        ch.legL.rotation.x = -1.45; ch.legR.rotation.x = -1.45;
        ch.armL.rotation.x = -0.5;
        ch.armR.rotation.x = -0.5 + Math.sin(T*2.2 + i)*0.3;
        ch.head.rotation.y = Math.sin(T*1.1 + i*1.7)*0.3;
        ch.targetRy = Math.atan2(MEET.x - ch.pos.x, MEET.z - ch.pos.y);
      } else {
        const typ = Math.sin(T*9 + ch.phase);
        ch.armL.rotation.x = -0.85 + typ*0.1;
        ch.armR.rotation.x = -0.85 - typ*0.1;
        ch.head.rotation.y = Math.sin(T*0.5 + i)*0.1;
        ch.g.position.y = 0;
      }
    }
    let dr = ch.targetRy - ch.g.rotation.y;
    while (dr > Math.PI) dr -= Math.PI*2;
    while (dr < -Math.PI) dr += Math.PI*2;
    ch.g.rotation.y += dr * Math.min(1, dt*8);
  });

  /* 회의 말풍선 */
  emoTimer += dt;
  if (meeting && emoTimer > 1.6){
    emoTimer = 0;
    const ch = chars[Math.floor(Math.random()*chars.length)];
    if (ch && !ch.target){
      if (ch.bubble) ch.g.remove(ch.bubble);
      const b = label(EMOJIS[Math.floor(Math.random()*EMOJIS.length)],
        { size:52, scale:0.02, bg:'rgba(255,255,255,.96)', border:'#F2B8A0' });
      b.position.y = 4.9;
      ch.g.add(b); ch.bubble = b;
      setTimeout(()=>{ if (ch.bubble===b){ ch.g.remove(b); ch.bubble=null; } }, 1400);
    }
  }

  dataGroup.traverse(o=>{
    if (o.userData.blink && o.material)
      o.material.color.setHex(Math.sin(T*6)>0 ? 0xFF5B72 : 0xFFB4C0);
  });

  if (fly){
    fly.t = Math.min(1, fly.t + dt*0.9);
    const e = 1 - Math.pow(1-fly.t, 3);
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
}

      const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const s = await getDoc(doc(db, 'erp_data', 'vo_snapshot'));
      if (!s.exists()) throw new Error('vo_snapshot 문서가 없습니다');
      snap = JSON.parse(s.data().data);
    }
    renderData(snap);
    buildKpi(snap);
  }catch(err){
    document.getElementById('stamp').textContent = '데이터 오류: '+(err.message||err);
    console.error(err);
  }
}

async function start(){
  buildRooms();
  tick();
  if (DEMO || !FB){
    document.getElementById('gate').style.display = 'none';
    loadData();
    return;
  }
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } =
    await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
  const { getFirestore } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const app2 = initializeApp(FB);
  const auth = getAuth(app2);
  db = getFirestore(app2);
  onAuthStateChanged(auth, u=>{
    if (u){ document.getElementById('gate').style.display='none'; loadData(); }
    else { document.getElementById('gate').style.display='flex'; }
  });
  document.getElementById('btn-login').onclick = async ()=>{
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ document.getElementById('err').textContent = e.message||String(e); }
  };
}
start();
</script>
</body>
</html>
