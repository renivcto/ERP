<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RENIV WORLD — 픽셀 오피스</title>
<style>
  :root{
    --brown:#6E5946; --tan:#9E8973; --cream:#FFF8EC; --line:#E8D9C2;
    --mint:#2FA98C; --blue:#5B8DEF; --pink:#E8768F; --gold:#E0A458; --purple:#9B7EDE;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#BFE0F5;
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--brown)}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #app{position:fixed;inset:0}

  .bar{position:fixed;top:0;left:0;right:0;height:54px;z-index:10;
    display:flex;align-items:center;gap:12px;padding:0 14px;
    background:rgba(255,248,236,.92);border-bottom:3px solid var(--line);backdrop-filter:blur(6px)}
  .brand{font-weight:900;font-size:16px;letter-spacing:-.3px}
  .brand span{color:var(--mint)}
  .stamp{font-size:11.5px;color:var(--tan)}
  .grow{flex:1}
  .btn{background:#fff;border:2px solid var(--line);color:var(--brown);
    font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:12px;cursor:pointer;
    box-shadow:0 2px 0 var(--line)}
  .btn:hover{background:#FFF3DD}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
  .btn.on{background:var(--mint);border-color:#1F8A70;color:#fff;box-shadow:0 2px 0 #1F8A70}
  .btn.meet{background:var(--pink);border-color:#C4506C;color:#fff;box-shadow:0 2px 0 #C4506C}

  .rooms{position:fixed;left:12px;top:66px;z-index:10;display:flex;flex-direction:column;gap:6px}
  .rooms .btn{text-align:left;min-width:128px}

  .panel{position:fixed;right:12px;top:66px;width:300px;max-height:calc(100vh - 150px);z-index:10;
    background:rgba(255,252,245,.96);border:3px solid var(--line);border-radius:16px;
    padding:16px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(90,70,52,.18)}
  .panel.show{display:block}
  .panel h3{margin:0 0 4px;font-size:16px}
  .panel .sub{font-size:11.5px;color:var(--tan);margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;
    border-bottom:2px dashed var(--line);font-size:13px}
  .kv b{font-variant-numeric:tabular-nums;font-weight:800}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 10px;
    border-radius:99px;background:#FFEAC9;color:#9C6A1E;margin-bottom:10px}
  .warn{color:#D6455D}

  .kpi{position:fixed;left:12px;bottom:12px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;max-width:64vw}
  .card{background:rgba(255,252,245,.95);border:2px solid var(--line);border-radius:14px;
    padding:8px 13px;min-width:106px;box-shadow:0 3px 0 var(--line)}
  .card .l{font-size:10.5px;color:var(--tan);font-weight:700}
  .card .v{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.4px}

  .alerts{position:fixed;right:12px;bottom:12px;z-index:10;max-width:300px}
  .alert{background:#FFE3E8;border:2px solid #F3AAB9;color:#B03A52;border-radius:12px;
    padding:8px 12px;font-size:12px;font-weight:700;margin-top:6px}

  .gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#BFE0F5 0%,#DFF0FA 55%,#C9E8C5 100%)}
  .gate .box{text-align:center;max-width:400px;padding:34px;background:rgba(255,252,245,.94);
    border:3px solid var(--line);border-radius:22px;box-shadow:0 10px 0 var(--line)}
  .gate h1{font-size:28px;margin:0 0 8px;letter-spacing:-.5px}
  .gate h1 span{color:var(--mint)}
  .gate p{color:var(--tan);font-size:13px;line-height:1.6;margin:0 0 20px}
  .gate .btn{font-size:14px;padding:12px 22px}
  .err{color:#D6455D;font-size:12px;margin-top:12px;min-height:16px}
  /* 3D 위에 겹치는 선명한 HTML 라벨 */
  #tags{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  .tg{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
    font-weight:800;letter-spacing:-.2px;
    background:rgba(255,252,245,.94);border:2px solid #E3D2B4;border-radius:10px;
    padding:3px 9px;font-size:13px;color:#6E5946;
    text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 2px 0 rgba(90,70,52,.13)}
  .tg.name{font-size:14px;padding:4px 11px;border-radius:12px}
  .tg.zone{font-size:17px;padding:6px 15px;border-radius:14px;border-width:3px}
  .tg.small{font-size:11.5px;padding:2px 7px}
  .tg.warnc{color:#C4364F;border-color:#F3AAB9;background:rgba(255,240,243,.95)}
  .tg.bubble{font-size:22px;padding:4px 10px;border-color:#F2B8A0}
  .tg.scr{background:rgba(38,55,72,.94);border-color:#7FD4E8;color:#EAF9FF;
    font-size:11.5px;padding:2px 8px;text-shadow:none;box-shadow:0 2px 0 rgba(20,35,50,.35)}
  .tg.big{font-size:19px;padding:7px 17px;border-width:3px;border-radius:15px}
  @media (max-width:820px){
    .panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:44vh}
    .kpi{max-width:calc(100vw - 24px);bottom:auto;top:62px}
    .alerts{display:none}
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const VO_VERSION = 'v2026-08-15f';        // 배포 확인용. 코드 고칠 때마다 올릴 것
console.log('[RENIV WORLD]', VO_VERSION);
const FB = window.__FB__ || null;
const DEMO = new URLSearchParams(location.search).has('demo');
let PIX = 1;                        // 렌더 해상도 (1=선명, 낮을수록 도트 굵음)

/* ═══════ 파스텔 팔레트 ═══════ */
const P = {
  floor:0xF5EAD8, grass:0xAAE694, wallLine:0xEBDBC1,
  mint:0x4EE4B8, blue:0x5F98F2, pink:0xF3728C, gold:0xF3BB5E, purple:0x9D78ED,
  wood:0xE8B273, woodDark:0xD98C45, white:0xFFFFFC, gray:0xC5D2DD,
  screen:0x8DABC4, paper:0xFFFDF6, skin:0xF8E5D3,
};

const ZONES = [
  { id:'ceo',       name:'대표이사실', x:-32, z:-16, w:26, d:20, color:0xA8F0DA, cam:[-33,13,-1], tgt:[-31,2,-16] },
  { id:'design',    name:'디자인팀',   x: 32, z:-16, w:26, d:20, color:0xF2AEC3, cam:[ 33,13,-1], tgt:[ 33,2,-16] },
  { id:'sales',     name:'국내영업팀', x:-32, z: 16, w:26, d:20, color:0xADCAF3, cam:[-33,13,31], tgt:[-31,2,16] },
  { id:'marketing', name:'마케팅팀',   x: 32, z: 16, w:26, d:20, color:0xC8B2F0, cam:[ 33,13,31], tgt:[ 33,2,16] },
  { id:'meeting',   name:'회의실',     x:  0, z: -8, w:24, d:18, color:0xF2DBAE, cam:[0,18,14],   tgt:[0,1,-8] },
  { id:'warehouse', name:'창고',       x:  0, z: 25, w:36, d:14, color:0xEED7AC, cam:[0,18,46],   tgt:[0,1,25] },
];

/* ═══════ 씬 ═══════ */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xBADFF2);
scene.fog = new THREE.Fog(0xBADFF2, 130, 260);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 54, 66);

const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
app.appendChild(renderer.domElement);
const tagRenderer = new CSS2DRenderer({ element: document.getElementById('tags') });
function resize(){
  const sharp = PIX > 0.6;
  renderer.setPixelRatio(sharp ? Math.min(devicePixelRatio||1, 2) : 1);
  renderer.setSize(Math.round(innerWidth*(sharp?1:PIX)), Math.round(innerHeight*(sharp?1:PIX)), false);
  renderer.domElement.style.width = '100%';
  renderer.domElement.style.height = '100%';
  tagRenderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);
document.getElementById('btn-q').onclick = e=>{
  PIX = PIX > 0.6 ? 0.42 : 1;
  e.target.textContent = PIX > 0.6 ? '🖼 화질: 선명' : '🎮 화질: 도트';
  resize();
};

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI/2 - 0.1;
controls.minDistance = 10;
controls.maxDistance = 140;

scene.add(new THREE.AmbientLight(0xFFFDF8, 1.24));
scene.add(new THREE.HemisphereLight(0xF2FAFF, 0xFFF8EC, 0.94));
const sun = new THREE.DirectionalLight(0xFFFDF4, 0.86);
sun.position.set(36, 60, 28);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
const SS = 80;
Object.assign(sun.shadow.camera, { left:-SS, right:SS, top:SS, bottom:-SS, near:1, far:200 });
scene.add(sun);

/* 잔디 + 오피스 바닥 */
const grass = new THREE.Mesh(new THREE.PlaneGeometry(400,400),
  new THREE.MeshLambertMaterial({ color:P.grass }));
grass.rotation.x = -Math.PI/2; grass.position.y = -0.3; grass.receiveShadow = true;
scene.add(grass);

const floor = new THREE.Mesh(new THREE.BoxGeometry(104, 0.6, 70),
  new THREE.MeshLambertMaterial({ color:P.floor }));
floor.position.y = -0.3; floor.receiveShadow = true;
scene.add(floor);

/* 존 러그 */
ZONES.forEach(z=>{
  const rug = new THREE.Mesh(new THREE.BoxGeometry(z.w, 0.14, z.d),
    new THREE.MeshLambertMaterial({ color:z.color }));
  rug.position.set(z.x, 0.07, z.z); rug.receiveShadow = true;
  scene.add(rug);
});

const dataGroup = new THREE.Group(); scene.add(dataGroup);
const pickable = [];
function addPick(m, info){ m.userData.info = info; pickable.push(m); }

/* ═══════ 헬퍼 ═══════ */
function won(n){ return (Math.round(Number(n)||0)).toLocaleString('ko-KR')+'원'; }
function shortWon(n){
  n = Math.round(Number(n)||0);
  if (Math.abs(n) >= 100000000) return (n/100000000).toFixed(1)+'억';
  if (Math.abs(n) >= 10000) return Math.round(n/10000).toLocaleString('ko-KR')+'만';
  return n.toLocaleString('ko-KR');
}
function box(w,h,d,color){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({ color }));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
/* 크기·색은 cls 로만 지정한다: zone / name / small / scr / bubble / big / warnc
   (여러 개는 공백으로 — 예: cls:'small warnc') */
function label(text, o={}){
  const d = document.createElement('div');
  d.className = o.cls ? 'tg ' + o.cls : 'tg';
  d.textContent = text;
  if (o.border) d.style.borderColor = o.border;
  if (o.color) d.style.color = o.color;
  const ob = new CSS2DObject(d);
  ob.center.set(0.5, 0.5);
  return ob;
}
/* 그룹을 씬에서 뺄 때 붙어 있던 HTML 라벨도 같이 지운다 */
function dropTags(obj){
  obj.traverse(o=>{
    if (o.isCSS2DObject && o.element && o.element.parentNode)
      o.element.parentNode.removeChild(o.element);
  });
}

/* ═══════ 픽셀 얼굴 (64x64, 직원별 개성) ═══════ */
function faceTexture(f){
  f = f || {};
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const hair = f.hairHex || '#3A2C20';
  const dark = f.lineHex || '#4A3D2E';

  g.fillStyle = f.skin || '#F8DCBE'; g.fillRect(0,0,64,64);

  /* 앞머리 */
  g.fillStyle = hair;
  const fr = f.fringe || 'flat';
  if (fr === 'flat'){ g.fillRect(0,0,64,11); }
  else if (fr === 'split'){ g.fillRect(0,0,64,9); g.fillRect(0,9,24,5); g.fillRect(40,9,24,4); }
  else if (fr === 'wave'){ g.fillRect(0,0,64,8);
    for (let x=0;x<64;x+=8) g.fillRect(x,8,6,(x/8)%2?6:3); }
  else if (fr === 'bob'){ g.fillRect(0,0,64,12);
    g.fillRect(0,12,8,32); g.fillRect(56,12,8,32); g.fillRect(0,12,20,4); }

  /* 눈썹 */
  g.fillStyle = f.browHex || hair;
  const by = f.browY || 20;
  if (f.brow === 'angled'){ g.fillRect(15,by+2,12,3); g.fillRect(37,by+2,12,3);
    g.fillRect(15,by,5,3); g.fillRect(44,by,5,3); }
  else if (f.brow === 'raised'){ g.fillRect(16,by-2,12,3); g.fillRect(36,by-2,12,3); }
  else { g.fillRect(16,by,12,3); g.fillRect(36,by,12,3); }

  /* 눈 */
  const ey = f.eyeY || 29;
  function eye(cx, closed){
    if (closed){ g.fillStyle = dark; g.fillRect(cx-5,ey+5,12,3);
      g.fillRect(cx-6,ey+3,2,3); g.fillRect(cx+6,ey+3,2,3); return; }
    const st = f.eye || 'round';
    g.fillStyle = '#FFFFFF';
    if (st !== 'sharp') g.fillRect(cx-5,ey,11,10);
    g.fillStyle = dark;
    if (st === 'sharp'){ g.fillRect(cx-5,ey-1,11,2); g.fillRect(cx-4,ey+1,9,9);
      g.fillStyle='#FFFFFF'; g.fillRect(cx-1,ey+2,3,3); }
    else if (st === 'calm'){ g.fillRect(cx-5,ey-1,11,3); g.fillRect(cx-3,ey+2,7,7);
      g.fillStyle='#FFFFFF'; g.fillRect(cx-1,ey+3,3,3); }
    else { g.fillRect(cx-4,ey+1,9,8);
      g.fillStyle='#FFFFFF'; g.fillRect(cx-2,ey+2,3,3); }
  }
  eye(20, false);
  eye(44, f.wink === true);

  /* 안경 */
  if (f.glasses){
    g.strokeStyle = f.glassHex || '#6E6152'; g.lineWidth = 2;
    g.strokeRect(11,ey-4,18,17); g.strokeRect(35,ey-4,18,17);
    g.beginPath(); g.moveTo(29,ey+4); g.lineTo(35,ey+4); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.30)'; g.fillRect(13,ey-2,7,6); g.fillRect(37,ey-2,7,6);
  }

  /* 코 */
  g.fillStyle = f.noseHex || '#EFCBAE'; g.fillRect(31,38,3,3);

  /* 볼터치 / 주근깨 */
  if (f.blush !== false){
    g.fillStyle = f.blushHex || '#F5A79A';
    const bw = f.blush === 'strong' ? 10 : 8;
    g.fillRect(10,40,bw,5); g.fillRect(54-bw,40,bw,5);
  }
  if (f.freckles){
    g.fillStyle = '#E3B491';
    [[16,38],[21,41],[26,38],[38,38],[43,41],[48,38]].forEach(q=>g.fillRect(q[0],q[1],2,2));
  }

  /* 입 */
  const my = f.mouthY || 47;
  g.fillStyle = f.mouthHex || '#B06A58';
  const m = f.mouth || 'smile';
  if (m === 'grin'){
    g.fillRect(23,my,18,8); g.fillRect(21,my-2,3,3); g.fillRect(40,my-2,3,3);
    g.fillStyle = '#FFFFFF'; g.fillRect(24,my+1,16,3);
    g.fillStyle = '#E86A80'; g.fillRect(26,my+5,12,2);
  } else if (m === 'smirk'){
    g.fillRect(28,my+2,12,3); g.fillRect(39,my-1,3,3);
  } else if (m === 'calm'){
    g.fillRect(28,my+2,9,3);
  } else {
    g.fillRect(25,my+1,14,3); g.fillRect(23,my-1,3,3); g.fillRect(38,my-1,3,3);
  }

  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.anisotropy = 4;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ═══════ 복셀 캐릭터 ═══════ */
const chars = [];
function makeChar(cfg){
  const g = new THREE.Group();
  const pants = cfg.pants || 0x6B87B3;

  const legL = box(0.34,0.8,0.36,pants); legL.position.set(-0.22,0.4,0);
  const legR = box(0.34,0.8,0.36,pants); legR.position.set( 0.22,0.4,0);

  const body = box(1.15,1.05,0.72,cfg.shirt); body.position.y = 1.32;

  const armGeo = ()=> {
    const geo = new THREE.BoxGeometry(0.3,0.85,0.34);
    geo.translate(0,-0.36,0);
    return geo;
  };
  const armMat = new THREE.MeshLambertMaterial({ color:cfg.shirt });
  const armL = new THREE.Mesh(armGeo(), armMat); armL.castShadow = true;
  armL.position.set(-0.76,1.78,0);
  const armR = new THREE.Mesh(armGeo(), armMat.clone()); armR.castShadow = true;
  armR.position.set( 0.76,1.78,0);

  const F = cfg.face || {};
  const skinMat = new THREE.MeshLambertMaterial({ color: cfg.skin || P.skin });
  const faceMat = new THREE.MeshLambertMaterial({ map:faceTexture(F) });
  const head = new THREE.Mesh(new THREE.BoxGeometry(1.24,1.18,1.1),
    [skinMat,skinMat,skinMat,skinMat,faceMat,skinMat]);
  head.position.y = 2.48; head.castShadow = true;

  const hairTop = box(1.34, cfg.acc==='beret'?0.22:0.34, 1.2, cfg.hair);
  hairTop.position.y = cfg.acc==='beret' ? 3.08 : 3.14;
  const hairBack = box(1.32, cfg.hairLong?1.2:0.72, 0.32, cfg.hair);
  hairBack.position.set(0, cfg.hairLong?2.35:2.62, -0.48);

  /* 머리 모양 · 액세서리 (성격) */
  const extra = [];
  if (cfg.hairSide){
    const sL = box(0.24,0.95,1.05,cfg.hair); sL.position.set(-0.66,2.35,-0.12);
    const sR = sL.clone(); sR.position.x = 0.66; extra.push(sL,sR);
  }
  if (cfg.hairTuft){
    const tf = box(0.34,0.38,0.34,cfg.hair); tf.position.set(0.44,3.4,0.16);
    tf.rotation.z = -0.3; extra.push(tf);
  }
  if (cfg.acc === 'vest'){
    const v = box(1.18,0.82,0.75,cfg.accColor); v.position.y = 1.2;
    const pk = box(0.24,0.82,0.77,0xFFFDF6); pk.position.y = 1.2;
    const col = box(0.74,0.15,0.1,0xFFFDF6); col.position.set(0,1.79,0.37);
    extra.push(v,pk,col);
  }
  if (cfg.acc === 'tie'){
    const col = box(0.76,0.16,0.1,0xFFFDF6); col.position.set(0,1.79,0.37);

function cuteBar(x, z, h, w, color, info, text){
  const g = new THREE.Group();
  h = Math.max(h, 0.5);
  const b = box(w, h, w, color); b.position.y = h/2;
  const cap = box(w+0.24, 0.24, w+0.24, 0xFFFFFF); cap.position.y = h+0.1;
  g.add(b, cap);
  dPick(b, info);
  if (text){
    const t = label(text, { cls:'small' });
    t.position.y = h + 1.0;
    g.add(t);
  }
  g.position.set(x, 0.14, z);
  dataGroup.add(g);
}
function barH(v, vmax, max=6, min=0.6){
  v = Math.max(0, Number(v)||0); vmax = Math.max(1, Number(vmax)||1);
  return min + (max-min)*Math.sqrt(Math.min(v/vmax,1));
}
function crate(x, z, qty, low, info, name){
  const g = new THREE.Group();
  const per = Math.max(30, Math.ceil(qty/4));
  const n = Math.max(1, Math.min(4, Math.ceil(qty/per)));
  for (let i=0;i<n;i++){
    const c = box(1.7,1.2,1.7, low?0xF4718B:0xF2AE5A);
    c.position.set((i%2)*0.12, 0.6+i*1.26, (i%2)*0.08);
    const tape = box(1.74,0.28,1.74, low?0xE95077:0xE59230);
    tape.position.copy(c.position);
    g.add(c, tape);
    dPick(c, info);
  }
  const t = label(`${name} ${qty}`, { cls: low ? 'small warnc' : 'small' });
  t.position.y = 0.6 + n*1.26 + 0.8;
  g.add(t);
  if (low){
    const bc = box(0.5,0.5,0.5,0xFF8FA0);
    bc.position.y = 0.6 + n*1.26 + 0.1;
    bc.userData.blink = true;
    g.add(bc);
  }
  g.position.set(x, 0.14, z);
  dataGroup.add(g);
}

    const dst = on ? ch.seatPos : ch.deskPos;
    ch.target = new THREE.Vector2(dst.x, dst.z);
    if (!on && ch.bubble){ ch.g.remove(ch.bubble); ch.bubble = null; }
  });
}

/* ═══════ UI ═══════ */
const panel = document.getElementById('panel');
function showPanel(info){
  if (!info){ panel.classList.remove('show'); return; }
  const rows = (info.rows||[]).map(([k,v])=>
    `<div class="kv"><span style="color:var(--tan)">${k}</span><b class="${info.warn?'warn':''}">${v}</b></div>`).join('');
  panel.innerHTML = `<div class="tag">${info.tag||''}</div><h3>${info.title||''}</h3>
    ${info.note?`<div class="sub">${info.note}</div>`:''}${rows}`;
  panel.classList.add('show');
}
function buildKpi(snap){
  const K = snap.kpi||{}, PY = snap.payments||{};
  document.getElementById('kpi').innerHTML = [
    ['이번 달 매출', shortWon(K.monthRevenue)+'원'],
    ['오늘 매출', shortWon(K.todayRevenue)+'원'],
    ['주문', (K.monthOrders||0)+'건'],
    ['결재 대기', ((snap.approvals||{}).pending||0)+'건'],

  ].map(([l,v])=>`<div class="card"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');

  document.getElementById('alerts').innerHTML =
    al.slice(0,4).map(a=>`<div class="alert">⚠ ${a.wh} · ${a.name} ${a.qty}개 — 발주 필요</div>`).join('');

    'ERP 기준 '+(snap.stamp||'-')+'  ·  '+VO_VERSION;
}
function buildRooms(){
  const el = document.getElementById('rooms');
  el.innerHTML = `<button class="btn on" data-cam="all">🗺 전체 보기</button>` +
    ZONES.map(z=>`<button class="btn" data-cam="${z.id}">${z.name}</button>`).join('');
  el.addEventListener('click', e=>{
    const b = e.target.closest('[data-cam]'); if (!b) return;
    el.querySelectorAll('.btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const id = b.dataset.cam;
    if (id === 'all'){ flyTo([0,54,66],[0,0,0]); return; }
    const z = ZONES.find(v=>v.id===id);
    flyTo(z.cam, z.tgt);
  });
}
let fly = null;
function flyTo(pos, tgt){
  fly = { p0:camera.position.clone(), p1:new THREE.Vector3(...pos),
          t0:controls.target.clone(), t1:new THREE.Vector3(...tgt), t:0 };
}
const ray = new THREE.Raycaster(), pt = new THREE.Vector2();
let dx0=0, dy0=0;
renderer.domElement.addEventListener('pointerdown', e=>{ dx0=e.clientX; dy0=e.clientY; });
renderer.domElement.addEventListener('pointerup', e=>{
  if (Math.hypot(e.clientX-dx0, e.clientY-dy0) > 6) return;
  pt.x = (e.clientX/innerWidth)*2-1; pt.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(pt, camera);
  const hit = ray.intersectObjects(pickable, false)[0];
  showPanel(hit ? hit.object.userData.info : null);
});

/* ═══════ 애니메이션 ═══════ */
const clock = new THREE.Clock();
let T = 0, emoTimer = 0;
const _tv = new THREE.Vector3();
let _fadeN = 0;
function fadeTags(){
  scene.traverse(o=>{
    if (!o.isCSS2DObject) return;
    o.getWorldPosition(_tv);
    const d = _tv.distanceTo(camera.position);
    const cl = o.element.classList;
    const far = cl.contains('small') ? 104 : (cl.contains('scr') ? 58 : 175);
    let op = 1;
    if (d > far) op = 0;
    else if (d > far - 20) op = (far - d) / 20;
    o.visible = op > 0.03;
    if (o.visible) o.element.style.opacity = op.toFixed(2);
  });
}

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  T += dt;
  if ((_fadeN++ % 3) === 0) fadeTags();

  chars.forEach((ch,i)=>{
    if (ch.target){
      const cur = ch.pos, dstV = ch.target;
      const d = dstV.clone().sub(cur);
      const dist = d.length();
      if (dist < 0.08){
        ch.pos.copy(dstV); ch.target = null;
        ch.targetRy = meeting
          ? Math.atan2(MEET.x-ch.pos.x, MEET.z-ch.pos.y)
          : ch.deskPos.ry;
      } else {
        const step = Math.min(dist, dt*6.5);
        d.normalize().multiplyScalar(step);
        cur.add(d);
        ch.targetRy = Math.atan2(d.x, d.y);
        ch.g.position.y = 0;
        const s = Math.sin(T*11 + i);
        ch.legL.rotation.x = s*0.7; ch.legR.rotation.x = -s*0.7;
        ch.armL.rotation.x = -s*0.55; ch.armR.rotation.x = s*0.55;
      }
      ch.g.position.set(ch.pos.x, 0, ch.pos.y);
    } else {
      if (!meeting){ ch.legL.rotation.x *= 0.8; ch.legR.rotation.x *= 0.8; }
      if (meeting){
        ch.g.position.y = 0.46;                       // 의자에 앉기
        ch.legL.rotation.x = -1.45; ch.legR.rotation.x = -1.45;
        ch.armL.rotation.x = -0.5;
        ch.armR.rotation.x = -0.5 + Math.sin(T*2.2 + i)*0.3;
        ch.head.rotation.y = Math.sin(T*1.1 + i*1.7)*0.3;
        ch.targetRy = Math.atan2(MEET.x - ch.pos.x, MEET.z - ch.pos.y);
      } else {
        const typ = Math.sin(T*9 + ch.phase);
        ch.armL.rotation.x = -0.85 + typ*0.1;
        ch.armR.rotation.x = -0.85 - typ*0.1;
        ch.head.rotation.y = Math.sin(T*0.5 + i)*0.1;
        ch.g.position.y = 0;
      }
    }
    let dr = ch.targetRy - ch.g.rotation.y;
    while (dr > Math.PI) dr -= Math.PI*2;
    while (dr < -Math.PI) dr += Math.PI*2;
    ch.g.rotation.y += dr * Math.min(1, dt*8);
  });

  /* 회의 말풍선 */
  emoTimer += dt;
  if (meeting && emoTimer > 1.6){
    emoTimer = 0;
    const ch = chars[Math.floor(Math.random()*chars.length)];
    if (ch && !ch.target){
      if (ch.bubble) ch.g.remove(ch.bubble);
      const b = label(EMOJIS[Math.floor(Math.random()*EMOJIS.length)], { cls:'bubble' });
      b.position.y = 4.9;
      ch.g.add(b); ch.bubble = b;
      setTimeout(()=>{ if (ch.bubble===b){ ch.g.remove(b); ch.bubble=null; } }, 1400);
    }
  }

  dataGroup.traverse(o=>{
    if (o.userData.blink && o.material)
      o.material.color.setHex(Math.sin(T*6)>0 ? 0xFF8FA0 : 0xFFB4C0);
  });

  if (fly){
    fly.t = Math.min(1, fly.t + dt*0.9);
    const e = 1 - Math.pow(1-fly.t, 3);
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
  tagRenderer.render(scene, camera);
}

let db = null;
async function loadData(){
  try{
    let snap;
    if (DEMO || !FB){ snap = DEMO_SNAP; }
    else {
      const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
      const s = await getDoc(doc(db, 'erp_data', 'vo_snapshot'));
      if (!s.exists()) throw new Error('vo_snapshot 문서가 없습니다');
      snap = JSON.parse(s.data().data);
    }
    renderData(snap);
    buildKpi(snap);

    await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
